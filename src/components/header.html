<!-- Header -->
        <header id="header" class="header">
            <div class="header-inner">
                <img src="assets/Logo.png" alt="Savannah Seeds" class="header-logo" id="header-logo">
                <button id="lang-toggle" class="lang-toggle" aria-label="Toggle Language" title="Switch Language">
                    <img src="assets/Translate icon.svg" alt="Translate" width="24" height="24">
                </button>
            </div>
            <div class="header-wave">
                <svg viewBox="0 0 400 40" preserveAspectRatio="none">
                    <!-- White background fill -->
                    <path d="M 0,0 L 400,0 L 400,30 C 280,40 120,0 0,15 Z" fill="#ffffff"/>
                    <!-- Green wave border -->
                    <path d="M 0,15 C 120,0 280,40 400,30" fill="none" stroke="#194E44" stroke-width="4"/>
                </svg>
            </div>
        </header>
